[project]
name = "quantum-computing-agent"
version = "1.0.0"
description = "Quantum Computing Agent - Specialist in quantum circuit execution on IBM Quantum"
readme = "README.md"
authors = [{ name = "Edgar Bruney" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "agentstack-sdk==0.4.0rc1",
    "beeai_framework>=0.1.76",
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.12.3,<2.0.0",
    "uvicorn<0.36.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
server = "quantum_computing_agent.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
